name: Tests

on:
    push:
    pull_request:

jobs:
    phpunit:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: shop
                    POSTGRES_PASSWORD: shop
                    POSTGRES_DB: shop_app_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, intl
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Create test database schema
              run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
              env:
                  DATABASE_URL: postgresql://shop:shop@127.0.0.1:5432/shop_app_test?serverVersion=16

            - name: Run tests
              run: php bin/phpunit
              env:
                  DATABASE_URL: postgresql://shop:shop@127.0.0.1:5432/shop_app_test?serverVersion=16
